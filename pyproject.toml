[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyler-netmap"
version = "0.1.0"
description = "A starter Python project for Tyler Netmap."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tyler-netmap = "tyler_netmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
