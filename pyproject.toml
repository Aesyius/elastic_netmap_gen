[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-netmap-gen"
version = "0.1.0"
description = "Generate diagrams.net network diagrams from Elastic agent inventory CSVs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
elastic-netmap-gen = "elastic_netmap_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
